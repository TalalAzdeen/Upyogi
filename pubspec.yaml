name: service_app
description: "صلح — Sulh home services"
publish_to: "none"

version: 1.5.0+9

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.4.0
  image_picker: ^1.1.2
  geolocator: ^14.0.1
  geocoding: ^3.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^3.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/chatgpt.png"

flutter:
  uses-material-design: true
  assets:
    - .env
