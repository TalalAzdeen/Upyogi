name: service_app
description: "Upyogi service marketplace app"
publish_to: "none"

version: 1.4.0+8

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.5.3
  http: ^1.4.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.0+1
  geolocator: ^14.0.1
  geocoding: ^3.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.1.4
  provider: ^6.1.5
  flutter_riverpod: ^3.3.2
  cupertino_icons: ^1.0.8

  # Keep only the core app features in the lean version.
  # The following are retained because they support the app's main flows:
  # location, profile, auth, network, media, and local storage.

  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  firebase_storage: ^12.4.6
  cloud_firestore: ^5.6.8
  firebase_database: ^11.3.7
  google_maps_flutter: ^2.12.2
  url_launcher: ^6.3.1

  # Optional extras deliberately kept minimal for the marketplace flow.
  shimmer: ^3.0.0
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/chatgpt.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
