name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Prepare app configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
        shell: python
        run: |
          import os
          from pathlib import Path
          values = {
              'API_BASE_URL': os.environ.get('API_BASE_URL', ''),
              'AUTH_BASE_URL': os.environ.get('AUTH_BASE_URL', ''),
              'STRIPE_PUBLISHABLE_KEY': os.environ.get('STRIPE_PUBLISHABLE_KEY', ''),
          }
          if any(chr(10) in v or chr(13) in v for v in values.values()):
              raise SystemExit('App configuration must use single-line values')
          Path('.env').write_text(''.join(f'{k}={v}'+chr(10) for k,v in values.items()))
      - run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run regression tests
        run: flutter test --reporter expanded
      - name: Build installable test APK
        run: flutter build apk --debug
      - run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/Upyogi-1.3.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Upyogi-1.3.0-APK
          path: build/app/outputs/flutter-apk/Upyogi-1.3.0-debug.apk
          if-no-files-found: error
          retention-days: 14
