name: Build Sulh Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Prepare app configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
        shell: python
        run: |
          import os
          from pathlib import Path
          values = {
              'API_BASE_URL': os.environ.get('API_BASE_URL', ''),
              'AUTH_BASE_URL': os.environ.get('AUTH_BASE_URL', ''),
              'STRIPE_PUBLISHABLE_KEY': os.environ.get('STRIPE_PUBLISHABLE_KEY', ''),
          }
          if any(chr(10) in v or chr(13) in v for v in values.values()):
              raise SystemExit('App configuration must use single-line values')
          Path('.env').write_text(''.join(f'{k}={v}'+chr(10) for k,v in values.items()))
      - run: flutter pub get
      - name: Preserve resolved dependencies
        uses: actions/upload-artifact@v4
        with:
          name: Sulh-1.6.0-lockfile
          path: pubspec.lock
      - name: Verify geography and confirmation-email logic
        run: node --test backend/supabase/functions/upyogi-api/domain.test.mjs
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run regression tests
        run: flutter test --reporter expanded
      - name: Build compact release APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --split-debug-info=build/symbols
      - name: Package compact APKs
        shell: python
        run: |
          from pathlib import Path
          import shutil, hashlib, json
          root = Path('build/app/outputs/flutter-apk')
          results = []
          for abi, label in [('arm64-v8a', 'arm64'), ('armeabi-v7a', 'arm32')]:
              apk = root / f'Sulh-1.6.0-{label}.apk'
              shutil.copyfile(root / f'app-{abi}-release.apk', apk)
              size = apk.stat().st_size
              if size >= 50 * 1024 * 1024:
                  raise SystemExit(f'{apk.name} exceeds the 50 MiB size budget')
              results.append({'file':apk.name,'bytes':size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()})
          (root / 'size-report.json').write_text(json.dumps(results,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: Sulh-1.6.0-APK
          path: |
            build/app/outputs/flutter-apk/Sulh-1.6.0-*.apk
            build/app/outputs/flutter-apk/size-report.json
          if-no-files-found: error
          retention-days: 14
