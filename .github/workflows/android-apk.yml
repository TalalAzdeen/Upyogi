name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Prepare app configuration
        env:
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
        shell: python
        run: |
          import os
          from pathlib import Path
          values = {
              'AUTH_BASE_URL': os.environ.get('AUTH_BASE_URL') or 'https://example.invalid/api/Auth',
              'STRIPE_PUBLISHABLE_KEY': os.environ.get('STRIPE_PUBLISHABLE_KEY', ''),
          }
          if any(chr(10) in v or chr(13) in v for v in values.values()):
              raise SystemExit('App configuration must use single-line values')
          Path('.env').write_text(''.join(f'{k}={v}'+chr(10) for k,v in values.items()))
